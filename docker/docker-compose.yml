name: hostmonitor

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required (see .env.example)}
      MYSQL_USER: ${DB_USER:?DB_USER is required (see .env.example)}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required (see .env.example)}
    volumes:
      - mysql_data:/var/lib/mysql
    # Порт наружу не публикуем: к БД ходят только контейнеры этой сети.
    # Нужен доступ с хоста — раскомментируйте, ограничив bind интерфейс:
    # ports:
    #   - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Пока monitoring/data/db.local.php не создан, db_config.php читает
      # параметры из этих переменных (см. db_config.php, ветка "Файл отсутствует").
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required (see .env.example)}
      DB_USER: ${DB_USER:?DB_USER is required (see .env.example)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    volumes:
      # Корень репозитория целиком: db_schema_path() ищет database/schema_mysql.sql
      # относительно monitoring/, а init_db.php нужен для применения схемы.
      - ..:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
