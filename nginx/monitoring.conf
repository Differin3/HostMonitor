# Nginx для панели HostMonitor
upstream php_backend {
    server unix:__PHP_FPM_SOCK__;
}

server {
    listen 80;
    server_name _;

    root /var/www/monitoring;
    index index.php;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # Синхронизация БД идёт короткими запросами; запас на медленный SkySQL/SSL.
    location = /api/db_ha.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location /frontend/ {
        alias /var/www/monitoring/frontend/;
        expires 5m;
        add_header Cache-Control "public";
    }

    location ^~ /data/ {
        deny all;
    }
}
